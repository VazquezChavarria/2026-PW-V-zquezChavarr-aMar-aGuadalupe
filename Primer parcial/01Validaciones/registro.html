<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrar Asistencia - CECyT 9</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<header>
  <a href="./detalle.html">Volver al detalle del taller</a>
</header>
<main> 
  <form class="formulario-registro">
    <h1>Formulario de Registro de asistencia</h1>

    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required>

    <label for="boleta">Número de boleta:</label>
    <input type="text" id="boleta" name="boleta" required>

    <button type="submit">Registrar asistencia</button>
    <p class="mensaje" id="mensaje"></p>
  </form>
</main>
<script src="./js/registro.js"></script>
</body>
</html>
