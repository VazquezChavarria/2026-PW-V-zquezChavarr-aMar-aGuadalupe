<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios con node</title>
    <link rel="stylesheet" href="./css/app_style.css">
</head>
<body>
    <header><h1>Ejercicios con node</h1></header>
    <main>
        <section class="ejercicio" >
            <h2 id="titulo-arreglos">Arreglos del código <code>01-arreglos.js</code></h2>
            <p>Datos de prueba con JS</p>
            <div class="tabla-scroll"><table class="tabla-talleres">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Instructor</th>
                        <th>Cupo</th>
                        <th>Inscritos</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div>
        <form id="form-arreglos" class="formulario">
            <div class="campos">
                <label for="operacion-arreglo" name-operación-arreglo>Operación</label>
                <select name="operacion-arreglo" id="operacion-arreglo">
                    <option value="forEach">ForEach - Lista Simple</option>
                    <option value="map">map - Copia solo nombres</option>
                    <option value="filter">filter - Filtar Talleres con cupo lleno</option>
                    <option value="find">find - Buscar por el nombre de instructor</option>
                </select>
                <input type="text" id="buscar-instructor" placeholder="Nombre del instructor" style="display:none;">
            </div>

            <button type="submit">Ejecutar</button>

        </form>
        <output class="resultado" id="resultado-arreglo" for="form-arreglo" ></output>
        </section>
    </main>
    <script src="./01-arreglos.js"></script>
    <script src="./app.js"></script>
</body>
</html>
